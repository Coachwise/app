name: Android Build

# Builds an installable Android APK from the Capacitor project.
#
# Triggers:
#   - pushing a version tag (v1.0.0, v1.2.3-beta, ...) → builds + attaches the
#     APK to a GitHub Release for that tag.
#   - manual "Run workflow" (workflow_dispatch) → builds + uploads the APK as a
#     downloadable artifact.
#
# Build config (Settings → Secrets and variables → Actions):
#   VITE_API_URL      variable or secret. REQUIRED, must be https:// — the build
#                     fails rather than shipping an APK pointed at localhost.
#   VITE_APP_CHANNEL  variable. Defaults to "beta"; set "stable" to drop the
#                     Beta badge shown in the app.
#   VITE_APP_VERSION  not configured — derived from the git tag (v1.2.0 → 1.2.0),
#                     or 0.0.0+<sha> for non-tag builds.
#
# Signing secrets (REQUIRED — the build fails without them):
#   ANDROID_KEYSTORE_BASE64    the upload keystore, `base64 -w0 coachwise.jks`
#   ANDROID_KEYSTORE_PASSWORD  keystore password
#   ANDROID_KEY_ALIAS          key alias inside the keystore
#   ANDROID_KEY_PASSWORD       key password (same as the store password unless
#                              you set a separate one)
# The key must never change: Android identifies an app by its signature, so a
# different key means the new APK cannot update the installed one. Back the
# keystore up offline — losing it means never updating this app id again.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      api_url:
        description: 'VITE_API_URL for this build (overrides the repo variable)'
        required: false
        default: ''

permissions:
  contents: write # needed to create/attach the Release on tag builds

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform + build-tools
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install web dependencies
        run: npm ci

      - name: Compute app version
        # Tag builds → the tag without its leading "v" (v1.2.0 → 1.2.0).
        # Other builds → 0.0.0+<short-sha> so it's obvious it's not a release.
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            V="${{ github.ref_name }}"; V="${V#v}"
          else
            V="0.0.0+${GITHUB_SHA::7}"
          fi
          echo "VITE_APP_VERSION=$V" >> "$GITHUB_ENV"
          # versionCode must be a monotonically increasing integer or Android
          # won't treat a new APK as an update (same code = stale WebView cache,
          # and only uninstall/reinstall shows new content). run_number is
          # guaranteed to increase across every CI run.
          echo "VERSION_CODE=${{ github.run_number }}" >> "$GITHUB_ENV"
          echo "Building app version $V (versionCode ${{ github.run_number }})"

      - name: Build web app
        env:
          # Manual input wins, then the Actions *variable*, then the *secret*
          # (vars and secrets are separate namespaces — accept either so the URL
          # can't go missing just because it was put in the wrong one).
          VITE_API_URL: ${{ github.event.inputs.api_url != '' && github.event.inputs.api_url || (vars.VITE_API_URL != '' && vars.VITE_API_URL || secrets.VITE_API_URL) }}
          # Release channel is a release decision, so it comes from a variable
          # too. Set VITE_APP_CHANNEL=stable to drop the Beta badge everywhere.
          VITE_APP_CHANNEL: ${{ vars.VITE_APP_CHANNEL != '' && vars.VITE_APP_CHANNEL || 'beta' }}
        run: |
          # Fail loudly rather than silently shipping an APK pointed at
          # localhost: on a device that's an unfixable "failed to fetch".
          if [ -z "$VITE_API_URL" ]; then
            echo "::error::VITE_API_URL is empty. Set it as an Actions variable (or secret) named VITE_API_URL, e.g. https://api.coachwises.ir"
            exit 1
          fi
          case "$VITE_API_URL" in
            https://*) ;;
            *) echo "::error::VITE_API_URL must be https:// for a device build (Android blocks cleartext). Got: $VITE_API_URL"; exit 1 ;;
          esac
          echo "Building against API: $VITE_API_URL"
          npm run build

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          # A debug build would be signed with a keystore the runner generates
          # fresh every time, so each APK would refuse to update the last one.
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not set. Add the signing secrets, or every build ships an APK that can't update the previous install."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/coachwise.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/coachwise.jks" >> "$GITHUB_ENV"

      - name: Build release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon -PcoachwiseVersionCode=$VERSION_CODE -PcoachwiseVersionName=$VITE_APP_VERSION
        working-directory: android

      - name: Verify APK signature
        # Catches a silently unsigned build before it reaches a phone, where the
        # only symptom is a refused install.
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort | tail -1)
          "$APKSIGNER" verify --print-certs android/app/build/outputs/apk/release/app-release.apk

      - name: Rename APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk \
             "dist/coachwise-${{ github.ref_type == 'tag' && github.ref_name || github.sha }}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: coachwise-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: Attach APK to Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
